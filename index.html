    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f4eb; 
            color: #222222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            background-color: #f7f4eb;
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 10px;
        }
        .top-title {
            font-family: 'GE SS Two', sans-serif;
            font-size: 14px;
            color: #7a8a99;
            margin-bottom: 20px;
            font-weight: bold;
            direction: rtl;
        }
        .logo-box {
            background-color: #eae3d2; 
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .main-title {
            font-family: 'Aptos', sans-serif;
            font-size: 22px;
            color: #1a3a4b;
            font-weight: normal;
            margin-bottom: 12px;
        }
        .description {
            font-family: 'GE SS Two', sans-serif;
            font-size: 13px;
            color: #667780;
            line-height: 1.7;
            margin-bottom: 25px;
            padding: 0 15px;
            font-weight: bold;
            direction: rtl;
        }
        .divider {
            width: 50px;
            height: 2px;
            background-color: #c95a49; 
            margin: 0 auto 30px;
        }
        
        .link-card {
            display: flex;
            flex-direction: row-reverse; 
            justify-content: space-between; 
            align-items: center;
            background-color: transparent;
            border: 1.5px solid #222222;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 15px;
            text-decoration: none;
            color: #222222;
            transition: all 0.2s ease;
        }
        .link-card:hover {
            background-color: rgba(0,0,0,0.03);
        }
        
        .right-content {
            display: flex;
            align-items: center;
            gap: 12px;
            direction: rtl; 
        }
        /* تنسيق حجم وشكل الأيقونات المدمجة الجديدة */
        .right-content svg {
            width: 20px;
            height: 20px;
            fill: #222222;
        }
        .right-content span {
            font-family: 'GE SS Two', sans-serif;
            font-size: 15px;
            font-weight: bold;
        }
        
        .left-text {
            font-family: 'Aptos', sans-serif;
            font-size: 12px;
            color: #999999;
            text-transform: uppercase;
            font-weight: normal;
            letter-spacing: 0.5px;
            direction: ltr;
            text-align: left;
        }
        
        .footer-text {
            font-family: 'GE SS Two', sans-serif;
            font-size: 12px;
            color: #a0aab2;
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: bold;
            direction: rtl;
        }
    </style>
